<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The page's own grammar, at 32px: paper ground, ink square, one accent
       hairline. No letterform, no glyph library — the site draws its marks
       from CSS geometry and the favicon follows the same law. -->
  <rect width="32" height="32" fill="#FFFFFF"/>
  <rect x="6" y="6" width="20" height="20" fill="#0A0A0A"/>
  <rect x="6" y="6" width="20" height="2.5" fill="#C0392B"/>
</svg>
